#
# The account authnd runs as. Installed as /usr/lib/sysusers.d/authnd.conf
# (or /etc/sysusers.d/authnd.conf) and applied with `systemd-sysusers`.
#
# A static account, not DynamicUser=: the files authnd reads -- password
# files, a DSN, a keytab, a TLS key -- are secrets kept readable by this
# account's group and nobody else, and a self-service password change writes
# back into them. A dynamic uid exists only while the service runs, so those
# files could not be given to it ahead of time, and anything it wrote would be
# owned by a number that later means somebody else.
#
#Type Name   ID Description                          Home           Shell
u     authnd -  "authnd LDAP directory and Kerberos KDC" /var/lib/authnd -
