name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  GOWORK: "off"
  CGO_ENABLED: "0"

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true
      # OpenLDAP's own client, as a judge for the LDAP directory this module
      # tests against: a fixture read only by the client in this same module
      # could confirm a misreading of the protocol rather than the protocol.
      # macOS ships it; Windows has none, and those tests skip there.
      - name: ldap-utils
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y ldap-utils
      - name: MIT Kerberos
        if: matrix.os == 'ubuntu-latest'
        run: |
          curl -fsS https://pkgx.sh | sh
          pkgx +kerberos.org -- klist -V
      - run: go vet ./...
      - name: gofmt
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          unformatted=$(gofmt -l $(git ls-files '*.go'))
          if [ -n "$unformatted" ]; then
            echo "::error::these files are not gofmt-clean:"; echo "$unformatted"; exit 1
          fi
      - run: go test -count=1 ./...
        env:
          AUTHND_REQUIRE_JUDGE: ${{ matrix.os == 'ubuntu-latest' && '1' || '' }}

  install:
    name: go install @latest works
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version-file: go.mod, check-latest: true, cache: true }
      # A `replace` directive makes `go install pkg@version` refuse outright.
      # This is a COMMAND: a module nobody can install is a command nobody has.
      - run: |
          if grep -q '^replace ' go.mod; then
            echo "::error::go.mod has a replace directive; go install ...@latest would refuse this module"
            exit 1
          fi
          go build ./...

  tags:
    name: build tags (${{ matrix.tags }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tags: [nosql, noldap, "nosql,noldap"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version-file: go.mod, check-latest: true, cache: true }
      # hcldir carries the tags a PROGRAM uses to leave out a database driver
      # or an LDAP client. They have to keep building here, or the program
      # that sets them finds out instead.
      # A tag that leaves a kind of directory out must leave a program that
      # still builds, still passes its tests, and is SMALLER -- the last one is
      # the point, so it is measured rather than assumed.
      - run: |
          go build -tags "${{ matrix.tags }}" -o /tmp/tagged .
          go build -o /tmp/full .
          full=$(stat -c%s /tmp/full); cut=$(stat -c%s /tmp/tagged)
          echo "everything: $((full/1024)) KiB   -tags ${{ matrix.tags }}: $((cut/1024)) KiB"
          [ "$cut" -lt "$full" ] || { echo "::error::the tagged build is not smaller"; exit 1; }
      - name: MIT Kerberos
        run: |
          curl -fsS https://pkgx.sh | sh
          pkgx +kerberos.org -- klist -V
      - env:
          AUTHND_REQUIRE_JUDGE: "1"
        run: go vet -tags "${{ matrix.tags }}" ./... && go test -tags "${{ matrix.tags }}" -count=1 ./...

  race:
    name: race detector
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version-file: go.mod, check-latest: true, cache: true }
      # ⛔ The judge has to be here too. It was in the `test` lane and nowhere
      # else, so every test that needs OpenLDAP's client SKIPPED in this one
      # -- silently, and the number this lane exists to measure was measured
      # without a third of the suite.
      - name: ldap-utils
        run: sudo apt-get update && sudo apt-get install -y ldap-utils
      # ⛔ A judge belongs in EVERY lane that runs the tests. The Kerberos
      # tests need MIT's client; without it they SKIP, and a skip is not a
      # failure. Only the CLIENT is borrowed — authnd is the KDC.
      - name: MIT Kerberos
        run: |
          curl -fsS https://pkgx.sh | sh
          pkgx +kerberos.org -- klist -V
      - run: go test -race -count=1 ./...
        env:
          AUTHND_REQUIRE_JUDGE: "1"

  coverage:
    name: coverage floor (88%, standard is 100%)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version-file: go.mod, check-latest: true, cache: true }
      # ⛔ The judge has to be here too. It was in the `test` lane and nowhere
      # else, so every test that needs OpenLDAP's client SKIPPED in this one
      # -- silently -- and the number this lane exists to measure was
      # measured without a third of the suite: 69.4% instead of 81.7%.
      - name: ldap-utils
        run: sudo apt-get update && sudo apt-get install -y ldap-utils
      # The same applies to MIT: without it the Kerberos tests skip, and this
      # lane would measure a run that never issued a ticket.
      - name: MIT Kerberos
        run: |
          curl -fsS https://pkgx.sh | sh
          pkgx +kerberos.org -- klist -V
      - env:
          AUTHND_REQUIRE_JUDGE: "1"
        run: |
          # THE ORG STANDARD IS 100%, AND THIS PROGRAM DOES NOT MEET IT.
          #
          # The floor was 80% and the note said the gap was "mostly the
          # signal handling in serve(): a test that sent this process a
          # SIGTERM would end the run it is part of". That was true and it
          # was not a reason -- the signal was never the interesting part.
          # The loop now takes a context, the signal stays in serve(), and
          # the shutdown path is tested: it must not return until the port
          # is actually free.
          #
          # What is left is main() and a handful of error branches. The
          # floor is RAISED, never lowered.
          FLOOR=88.0
          go test -coverprofile=cover.out -coverpkg=./... ./... >/dev/null
          go tool cover -func=cover.out
          cov=$(go tool cover -func=cover.out | tail -1 | awk '{print $3}' | tr -d '%')
          echo "coverage: ${cov}%  floor: ${FLOOR}%  standard: 100%"
          # Written as an `if` rather than `awk ... && { ... }`: in that form
          # the LIST's status is awk's, and when it is the last line of the
          # script the step inherits it -- so a lane that is comfortably above
          # its floor fails, saying nothing about why. It cost a run here.
          if awk -v c="$cov" -v f="$FLOOR" 'BEGIN{exit !(c+0 < f+0)}'; then
            echo "::error::coverage ${cov}% fell below the recorded floor ${FLOOR}%"
            exit 1
          fi
          awk -v c="$cov" 'BEGIN{if (c+0 < 100) printf "::warning::%.1f points short of the 100%% standard\n", 100-c}'

  # The toolchain is the one go.mod names (go-version-file), so a floor too
  # low to carry the standard library's fixes is a finding HERE: govulncheck
  # exits 3 on any, and the job fails.
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version-file: go.mod, check-latest: true, cache: true }
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  arches:
    name: arch ${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goarch: [amd64, arm64, riscv64, loong64, ppc64le, s390x, 386, arm]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version-file: go.mod, check-latest: true, cache: true }
      - run: GOARCH=${{ matrix.goarch }} go build ./...
      # ⛔ `qemu-user-static` is a VIRTUAL package on Ubuntu 26.04, which
      # `ubuntu-latest` became on 2026-10-19, and apt refuses to choose between its
      # two providers:
      #
      #   E: Package 'qemu-user-static' has no installation candidate
      #
      # ⚠ Installing a provider is NOT the fix: `qemu-user-binfmt` registers binfmt
      # handlers, it does not ship the `qemu-<arch>-static` binaries this lane
      # invokes. `qemu-user` ships the dynamic `qemu-<arch>`, which is all that
      # `go test -exec` needs, so both are installed and BOTH NAMES are accepted
      # below. go-tex/engine#645 has the full account.
      - name: install qemu user-mode emulators
        timeout-minutes: 10
        run: sudo apt-get update && sudo apt-get install -y qemu-user qemu-user-binfmt
      - name: Test
        run: |
          # ⛔ Resolve the emulator, accept EITHER binary name, and FAIL when neither
          # is there -- a lane that reports success for an architecture it never ran is
          # the one outcome this matrix exists to rule out. qemu-user ships the dynamic
          # qemu-<arch>; qemu-user-static, now a virtual package, shipped the static one.
          qemu_for() {
            for cand in "qemu-$1-static" "qemu-$1"; do
              command -v "$cand" >/dev/null 2>&1 && { printf '%s\n' "$cand"; return 0; }
            done
            echo "::error::no qemu user emulator for $1 (looked for qemu-$1-static and qemu-$1)" >&2
            return 1
          }
          case "${{ matrix.goarch }}" in
            amd64|arm64) go test -count=1 ./... ;;
            riscv64) e="$(qemu_for riscv64)" || exit 1; echo "running riscv64 under $e"; GOARCH=riscv64 go test -count=1 -exec="$e" ./... ;;
            loong64) e="$(qemu_for loongarch64)" || exit 1; echo "running loong64 under $e"; GOARCH=loong64 go test -count=1 -exec="$e" ./... ;;
            ppc64le) e="$(qemu_for ppc64le)" || exit 1; echo "running ppc64le under $e"; GOARCH=ppc64le go test -count=1 -exec="$e" ./... ;;
            s390x) e="$(qemu_for s390x)" || exit 1; echo "running s390x under $e"; GOARCH=s390x   go test -count=1 -exec="$e" ./... ;;
            # 32-bit: 386 runs natively on the amd64 runner (qemu-i386 loses float
            # state across preemption); arm under qemu.
            386)      GOARCH=386     go test -count=1 ./... ;;
            arm) e="$(qemu_for arm)" || exit 1; echo "running arm under $e"; GOARCH=arm     go test -count=1 -exec="$e" ./... ;;
          esac
